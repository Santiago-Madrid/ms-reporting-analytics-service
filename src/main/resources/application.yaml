spring:
  application:
    name: ${SPRING_APPLICATION_NAME:ms-reporting-analytics-service}

  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://${MONGO_HOST:worlddance-mongodb}:${MONGO_PORT:27017}/${MONGO_DB:world_dance_reports}}

  data:
    mongodb:
      auto-index-creation: true

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:worlddance-consul}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        service-name: ${SPRING_CLOUD_CONSUL_DISCOVERY_SERVICE_NAME:ms-reporting-analytics-service}
        hostname: ${SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME:ms-reporting-analytics-service}
        prefer-ip-address: false
        health-check-path: /api/v1/actuator/health
        health-check-interval: 10s

server:
  port: ${SERVER_PORT:9098}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api/v1}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
  endpoint:
    health:
      show-details: always
  health:
    mongo:
      enabled: false

ai:
  mcp:
    report-endpoint: ${MCP_REPORT_URL:http://mcp-scheduling-reporting:5000/generate-report-narrative}

security:
  jwt:
    secret: ${JWT_SECRET:F0bVQgRnuk6DRxooVWKaG0ndlgqEeI/4YXObXeOaR2Q=}
