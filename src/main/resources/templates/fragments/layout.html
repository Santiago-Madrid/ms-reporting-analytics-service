<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/></head>
<body>

<!--
  Hoja de estilos compartida por todos los reportes (report.html,
  enrollment-list.html, schedule.html). Inspirada en el diseño Stitch
  "WorldDance - Reporte Oficial PDF de Inscritos Pro" (header oscuro de
  marca, tarjetas KPI, tabla con avatares/badges, bloque de firma).
  openhtmltopdf 1.0.10 solo soporta CSS 2.1 + un poco de CSS3: nada de
  flexbox, grid ni gradientes reales, por eso el degradado de marca se
  simula con 3 bloques de color solido y el header es un card oscuro
  solido en vez de un gradient() real.
-->
<style th:fragment="styles">
    @page {
        size: A4;
        margin: 1.5cm 1.3cm 1.7cm 1.3cm;
        @bottom-left {
            content: "World Dance  •  Reporte de Acreditación Oficial";
            font-size: 8px;
            color: #94a3b8;
        }
        @bottom-right {
            content: "Página " counter(page) " de " counter(pages);
            font-size: 8px;
            color: #64748b;
        }
    }

    body {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        color: #1e293b;
        font-size: 12px;
        line-height: 1.5;
        margin: 0;
        padding: 0;
    }

    /* Banda superior de acento: simula el gradiente violeta -> indigo con 3 bloques solidos */
    table.accent-strip { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    table.accent-strip td { height: 5px; padding: 0; font-size: 0; line-height: 0; }
    .accent-1 { background-color: #6d28d9; }
    .accent-2 { background-color: #7c3aed; }
    .accent-3 { background-color: #8b5cf6; }

    /* Header oscuro tipo tarjeta, con logo + titulo + estado del documento */
    table.brand-header {
        width: 100%;
        border-collapse: collapse;
        background-color: #14122d;
        border-radius: 12px;
        margin-bottom: 20px;
    }
    table.brand-header td { padding: 18px 22px; vertical-align: middle; }
    td.brand-logo-cell { width: 60px; }
    img.brand-logo { height: 40px; width: auto; }
    p.brand-eyebrow {
        margin: 0 0 6px 0;
        font-size: 9.5px;
        letter-spacing: 1.8px;
        text-transform: uppercase;
        color: #c4b5fd;
        font-weight: bold;
    }
    p.brand-eyebrow span.sep { color: #7c3aed; margin: 0 6px; }
    h1.brand-title { margin: 0; font-size: 22px; color: #ffffff; letter-spacing: 0.3px; }
    p.brand-subtitle { margin: 8px 0 0 0; font-size: 9.5px; color: #ddd6fe; }
    td.brand-status-cell {
        text-align: right;
        width: 175px;
        border-left: 1px solid #2e2a54;
    }
    p.doc-status-label { margin: 0; font-size: 8.5px; letter-spacing: 1.3px; text-transform: uppercase; color: #c4b5fd; }
    p.doc-status-value { margin: 4px 0 0 0; font-size: 10.5px; font-weight: bold; color: #ffffff; }
    p.doc-status-value span.dot { color: #34d399; }
    p.doc-id { margin: 6px 0 0 0; font-size: 8.5px; color: #9c94c0; }

    /* Tarjetas KPI */
    table.kpi-grid { width: 100%; border-collapse: separate; border-spacing: 6px 0; margin-bottom: 22px; }
    table.kpi-grid td.kpi-card { padding: 10px 12px; border-radius: 8px; text-align: left; vertical-align: top; }
    .kpi-label { display: block; font-size: 8px; font-weight: bold; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; }
    .kpi-value { font-size: 19px; font-weight: bold; }
    .kpi-hint { font-size: 8px; font-weight: 600; margin-left: 4px; }

    .kpi-neutral { background-color: #f8fafc; border: 1px solid #e2e8f0; }
    .kpi-neutral .kpi-label { color: #94a3b8; }
    .kpi-neutral .kpi-value { color: #0f172a; }
    .kpi-neutral .kpi-hint { color: #94a3b8; }

    .kpi-approved { background-color: #ecfdf5; border: 1px solid #a7f3d0; }
    .kpi-approved .kpi-label, .kpi-approved .kpi-value, .kpi-approved .kpi-hint { color: #047857; }

    .kpi-rejected { background-color: #fef2f2; border: 1px solid #fecaca; }
    .kpi-rejected .kpi-label, .kpi-rejected .kpi-value, .kpi-rejected .kpi-hint { color: #b91c1c; }

    .kpi-track { background-color: #f5f3ff; border: 1px solid #ddd6fe; }
    .kpi-track .kpi-label, .kpi-track .kpi-value, .kpi-track .kpi-hint { color: #6d28d9; }

    .kpi-warning { background-color: #fffbeb; border: 1px solid #fde68a; }
    .kpi-warning .kpi-label, .kpi-warning .kpi-value, .kpi-warning .kpi-hint { color: #b45309; }

    h2.section-title {
        color: #1e1b4b;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin: 26px 0 10px 0;
        padding-bottom: 6px;
        border-bottom: 2px solid #7c3aed;
    }

    /* Tabla de datos */
    table.data-table { width: 100%; border-collapse: collapse; border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 22px; }
    table.data-table th {
        background-color: #f8fafc;
        color: #64748b;
        font-size: 9px;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        font-weight: bold;
        padding: 10px 10px;
        text-align: left;
        border-bottom: 1px solid #e2e8f0;
    }
    table.data-table td {
        padding: 9px 10px;
        border-bottom: 1px solid #eef2f7;
        font-size: 10.5px;
        color: #334155;
    }
    table.data-table tr:last-child td { border-bottom: none; }
    table.data-table tr:nth-child(even) td { background-color: #fbfbfe; }

    .avatar {
        display: inline-block;
        width: 20px;
        height: 20px;
        line-height: 20px;
        text-align: center;
        border-radius: 50%;
        background-color: #ede9fe;
        color: #6d28d9;
        font-size: 8px;
        font-weight: bold;
        margin-right: 6px;
    }

    .badge-modality {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 5px;
        font-size: 9.5px;
        font-weight: 600;
        background-color: #f1f5f9;
        color: #334155;
    }

    .status-pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 8.5px;
        font-weight: bold;
        text-transform: uppercase;
    }
    .status-approved { background-color: #d1fae5; color: #065f46; border: 1px solid #6ee7b7; }
    .status-pending { background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; }
    .status-rejected { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    .track-pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 5px;
        font-size: 8.5px;
        font-weight: bold;
        text-transform: uppercase;
    }
    .status-track-yes { background-color: #7c3aed; color: #ffffff; }
    .status-track-no { background-color: #e2e8f0; color: #475569; border: 1px solid #cbd5e1; }

    /* Firma y validacion */
    table.signature-block { width: 100%; border-collapse: collapse; margin-top: 8px; padding-top: 14px; }
    table.signature-block td { vertical-align: middle; padding: 6px 10px; }
    .signature-name { font-style: italic; font-weight: bold; color: #4c1d95; font-size: 13px; text-align: center; }
    .signature-line { border-top: 1px solid #cbd5e1; width: 140px; margin: 5px auto 0 auto; }
    .signature-caption { font-size: 8px; color: #64748b; text-transform: uppercase; letter-spacing: 0.4px; text-align: center; display: block; margin-top: 4px; }
    .cert-badge {
        display: inline-block;
        font-size: 8.5px;
        font-weight: bold;
        text-transform: uppercase;
        color: #6d28d9;
        background-color: #f5f3ff;
        border: 1px solid #ddd6fe;
        padding: 3px 9px;
        border-radius: 4px;
    }
    .doc-meta { text-align: right; font-size: 9px; color: #64748b; }
    .doc-meta strong { color: #334155; }

    .narrative { text-align: justify; margin-bottom: 20px; color: #475569; }
    .empty-text { color: #a0aec0; font-style: italic; font-size: 12px; }
    .summary-line { margin: 4px 0 18px 0; font-size: 11px; color: #64748b; }
</style>

<div th:fragment="header(eyebrow, title, subtitle, docId)">
    <table class="accent-strip">
        <tr><td class="accent-1"></td><td class="accent-2"></td><td class="accent-3"></td></tr>
    </table>
    <table class="brand-header">
        <tr>
            <td class="brand-logo-cell">
                <img th:if="${logoDataUri != null and !#strings.isEmpty(logoDataUri)}" th:src="${logoDataUri}" class="brand-logo"/>
            </td>
            <td>
                <p class="brand-eyebrow">WORLD DANCE<span class="sep">·</span><span th:text="${eyebrow}">REPORTE</span></p>
                <h1 class="brand-title" th:text="${title}">Título del reporte</h1>
                <p class="brand-subtitle" th:if="${subtitle != null and !#strings.isEmpty(subtitle)}" th:text="${subtitle}"></p>
            </td>
            <td class="brand-status-cell">
                <p class="doc-status-label">Estado del Documento</p>
                <p class="doc-status-value"><span class="dot">●</span> Emisión Oficial</p>
                <p class="doc-id" th:if="${docId != null and !#strings.isEmpty(docId)}" th:text="'ID: ' + ${docId}"></p>
            </td>
        </tr>
    </table>
</div>

<table class="signature-block" th:fragment="signatureBlock">
    <tr>
        <td style="width:34%;"></td>
        <td style="width:33%; text-align:center;">
            <div class="signature-name">Comité Técnico World Dance</div>
            <div class="signature-line"></div>
            <span class="signature-caption">Firma y Aval Autorizado</span>
        </td>
        <td style="width:33%;" class="doc-meta">
            <span class="cert-badge">Reporte Verificado</span><br/>
            <strong>Generado por la plataforma World Dance</strong>
        </td>
    </tr>
</table>

</body>
</html>
